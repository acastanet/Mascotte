<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnSu — Variantes de la mascotte</title>
<style>
  :root {
    --ansu: #1019a8;
    --paper: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(18px, 4vw, 48px);
    font-family: system-ui, sans-serif;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  header h1 {
    color: var(--ansu);
    margin: 0 0 0.5rem 0;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
  }

  header p {
    color: #333;
    margin: 0;
    font-size: clamp(0.9rem, 2vw, 1.1rem);
  }

  .nav-link {
    display: inline-block;
    margin-bottom: 1rem;
    color: var(--ansu);
    text-decoration: none;
    font-size: 1rem;
  }

  .nav-link:hover {
    text-decoration: underline;
  }

  .mark {
    width: min(760px, 92vw);
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .fill {
    fill: var(--ansu);
  }

  .frame {
    fill: none;
    stroke: var(--ansu);
    stroke-width: 3;
    vector-effect: non-scaling-stroke;
  }

  .eye {
    fill: var(--ansu);
    transform-box: fill-box;
    transform-origin: center;
  }

  .variants-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
    width: 100%;
    margin-top: 2rem;
  }

  .variant-card {
    border: 2px solid var(--ansu);
    border-radius: 12px;
    padding: 1.5rem;
    text-align: center;
  }

  .variant-card h2 {
    color: var(--ansu);
    margin: 0 0 1rem 0;
    font-size: 1.3rem;
  }

  .variant-svg {
    width: 100%;
    max-width: 250px;
    margin: 0 auto;
  }
</style>
</head>
